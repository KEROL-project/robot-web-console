                      <use href="#check2"></use>
                  </svg>
              </button>
          </li>
      </ul>
    </div>

    <header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">

    <div class="container-fluid">
      <div class="row">
        <div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
          <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="sidebarMenuLabel">KEROL</h5>
              <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
              <ul class="nav flex-column">
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center gap-2 active" aria-current="page" href="index">
                    <svg class="bi"><use xlink:href="#plus-circle"/></svg>
                    Data collection
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center gap-2" href="annotations">
                    <svg class="bi"><use xlink:href="#file-earmark"/></svg>
                    Data annotation
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-center flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 text-center">Robot Data Annotation Interface</h1>
            </div>

            <div class="form-group row justify-content-center mb-3">
              <div class="col-3">
                <select class="form-select" id="robot">
                  <option value="" selected>Select robot...</option>
                  <option value="jessie">jessie</option>
                </select>
              </div>
              <div class="col-4">
                <select class="form-select" id="datasets">
                </select>
              </div>
              <div class="col-3">
                <select class="form-select" id="observations">
                </select>
              </div>
              <div class="col-1">
                <button id="retrieve-data" type="button" class="btn btn-success w-100" disabled>Load data</button>
              </div>
              <div class="col-1">
                <div id="statusSpinner" class="spinner-border" style="display: none;" role="status">
                </div>
              </div>
            </div>

            <div class="row no-gutters">
                <div class="col-12 col-md-6 col-lg-12 px-mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="form-group row justify-content-center mb-3">
                            <div class="col-md-3">
                                <button id="previous-image" type="button" class="btn btn-secondary w-100"><i class="bi bi-arrow-left"></i>Previous</button>
                            </div>
                            <div class="col-md-3">
                              <button id="image-counter" class="btn btn-success w-100" disabled>Image 0/0</button>
                            </div>
                            <div class="col-md-3">
                                <button id="next-image" type="button" class="btn btn-secondary w-100">Next<i class="bi bi-arrow-right"></i></button>
                            </div>
                        </div>

                        <!-- <div class="form-group row justify-content-center mb-1">
                            <div id="openseadragon-viewer" style="width: 800px; height: 600px;"></div>
                        </div> -->

                        <div style="display: flex; gap: 20px;">
                          <div style="flex: 2;">
                            <div id="openseadragon-viewer" style="width: 100%; height: 600px;"></div>
                          </div>

                          <div style="flex: 1; display: flex; flex-direction: column;">
                            <!-- <label for="annotation-text">Add Annotation:</label> -->
                            <label for="annotation-text" class="form-label fw-semibold d-block">Add Annotation:</label>
                            <br>
                            <textarea id="annotation-text" rows="10" style="width: 100%;"></textarea>
                            <br>
                            <div class="mt-3">
                              <label class="form-label fw-semibold d-block">Annotation Type:</label>
                            <div class="form-check form-check-inline">
                              <input class="form-check-input" type="radio" name="annotationType" id="anomalyStart" value="start">
                              <label class="form-check-label" for="anomalyStart">Start</label>
                            </div>
                            <div class="form-check form-check-inline">
                              <input class="form-check-input" type="radio" name="annotationType" id="anomalyStop" value="stop">
                              <label class="form-check-label" for="anomalyStop">Stop</label>
                            </div>
                            <div class="form-check form-check-inline">
                              <input class="form-check-input" type="radio" name="annotationType" id="anomalyOngoing" value="ongoing">
                              <label class="form-check-label" for="anomalyOngoing">Ongoing</label>
                            </div>
                            <div style="margin-top: 30px;">
                              <button id="save-annotation" class="btn btn-primary">Save Annotation</button>
                            </div>

                            <!-- <div id="image-info" class="mt-2 mb-2 text-center">
                              <span> Image #: </span><strong id="image-counter">0</strong>
                            </div> -->
                          </div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </main>
      </div>
    </div>
  </body>
